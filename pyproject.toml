[tool.ruff]
# Глобальные настройки, общие для всех инструментов (линтера и форматера).
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# Все настройки, связанные с линтером (проверкой кода), теперь находятся здесь.
select = [
    "E",  # Ошибки стиля (pycodestyle)
    "F",  # Логические ошибки (PyFlakes)
    "I",  # Правила сортировки импортов (isort)
    "UP", # Использовать более современные возможности Python (pyupgrade)
]
# Если понадобится игнорировать правила, это делается здесь:
# ignore = []

[tool.ruff.format]
# Настройки, связанные только с форматированием кода, остаются здесь.
# Например, стиль кавычек:
# quote-style = "double"